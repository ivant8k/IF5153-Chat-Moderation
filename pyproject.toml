[project]
name = "if5153-chat-moderation"
version = "0.1.0"
description = "In-Game Chat Moderation and Censor, IF5153 kelompok 12"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "protobuf>=5.0",
    "sentencepiece>=0.2",
    "torch==2.15.0",
    "transformers==5.22.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[tool.uv]
package = false
